[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crypticsymmetry/MARS"

[workspace.dependencies]
mars-hv = { path = "crates/mars-hv" }
mars-rel = { path = "crates/mars-rel" }
mars-encode = { path = "crates/mars-encode" }
mars-gen = { path = "crates/mars-gen" }
mars-index = { path = "crates/mars-index" }
mars-map = { path = "crates/mars-map" }
rayon = "1.10"
rustc-hash = "2"
smallvec = { version = "1.13", features = ["union", "const_generics"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
codegen-units = 4
lto = "thin"

[profile.bench]
inherits = "release"

[workspace.lints.clippy]
# Index loops over parallel fixed-size arrays are clearer than zipped iterators here.
needless_range_loop = "allow"
